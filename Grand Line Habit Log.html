<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Line Habit Log</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#7fd3ff;--sky2:#d8f3ff;--sea1:#1fa6d8;--sea2:#0b6fa8;--paper:#f6e3b4;--paper2:#ecd29a;--ink:#4a2c12;--gold:#f5b82e;--red:#e4483b;--card:rgba(255,248,230,.94);--track:#d9bf86;--text:#4a2c12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0b1033;--sky2:#26306b;--sea1:#12507a;--sea2:#06203a;--paper:#d8c08c;--paper2:#c4a96f;--card:rgba(232,214,170,.95)}}
:root[data-theme="dark"]{--sky1:#0b1033;--sky2:#26306b;--sea1:#12507a;--sea2:#06203a;--paper:#d8c08c;--paper2:#c4a96f;--card:rgba(232,214,170,.95)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--text);background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--sea1) 55%);background-attachment:fixed;overflow-x:hidden}
.sun{position:fixed;top:40px;right:8%;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fff6b0,#ffd23f);box-shadow:0 0 60px 20px rgba(255,214,63,.55);animation:pulse 4s ease-in-out infinite;z-index:0}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 80px 30px rgba(255,214,63,.6)}}
.cloud{position:fixed;height:34px;width:110px;background:#fff;border-radius:40px;opacity:.85;z-index:0;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46px;height:46px;top:-22px;left:18px}.cloud::after{width:34px;height:34px;top:-14px;left:56px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.waves{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:0;pointer-events:none}
.wave{position:absolute;left:-100px;right:-100px;bottom:0;height:100%;background:var(--sea2);opacity:.55;border-radius:50% 50% 0 0/38px 38px 0 0;animation:sway 5s ease-in-out infinite}
.wave:nth-child(2){opacity:.7;height:75%;animation-duration:7s;animation-direction:reverse;background:var(--sea1)}
.wave:nth-child(3){opacity:.9;height:45%;animation-duration:4s;background:var(--sea2)}
@keyframes sway{50%{transform:translateX(60px) translateY(6px)}}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:22px 14px 190px}
header{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ttl{display:flex;align-items:center;gap:10px}
.ship{width:84px;height:70px;animation:bob 3.2s ease-in-out infinite;flex:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
h1{font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:2.3rem;letter-spacing:.04em;margin:0;color:#fff;-webkit-text-stroke:2px #5a2d0c;paint-order:stroke fill;text-shadow:3px 3px 0 #5a2d0c;line-height:1}
.sub{font-weight:800;font-size:.82rem;color:#fff;text-shadow:1px 1px 0 #5a2d0c;margin-top:4px}
.tools{display:flex;gap:8px}
button.ghost{font-family:Bangers,Impact,sans-serif;letter-spacing:.05em;font-size:1rem;background:var(--gold);color:var(--ink);border:3px solid #5a2d0c;border-radius:14px;padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 #5a2d0c;transition:transform .1s,box-shadow .1s}
button.ghost:active{transform:translateY(4px);box-shadow:0 0 0 #5a2d0c}
.score{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:3px solid #5a2d0c;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 rgba(90,45,12,.55);text-align:center}
.stat.poster{background:repeating-linear-gradient(0deg,var(--paper),var(--paper) 6px,var(--paper2) 7px);transform:rotate(-1.5deg)}
.stat small{display:block;font-family:Bangers,Impact,sans-serif;letter-spacing:.12em;color:var(--red);font-size:1.05rem}
.stat b{display:block;font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:1.8rem;letter-spacing:.03em;line-height:1.1}
.stat span{font-size:.72rem;font-weight:800;opacity:.75}
.bump{animation:bump .45s ease}
@keyframes bump{35%{transform:scale(1.35) rotate(-3deg)}}
.card{background:var(--card);border:3px solid #5a2d0c;border-radius:22px;padding:16px;box-shadow:0 7px 0 rgba(90,45,12,.55);overflow-x:auto}
.grid{min-width:520px}
.row{display:grid;grid-template-columns:150px repeat(7,1fr);align-items:center;gap:6px;padding:9px 0;border-bottom:2px dashed rgba(90,45,12,.25)}
.row:last-child{border-bottom:0}
.row.head{padding-top:0;text-align:center;font-family:Bangers,Impact,sans-serif;letter-spacing:.08em;font-size:1rem;color:var(--red)}
.name{font-weight:800;font-size:.92rem;cursor:pointer;text-align:left;font-family:Nunito,system-ui,sans-serif;letter-spacing:0;color:var(--ink)}
.cell{display:flex;justify-content:center}
.chk{appearance:none;-webkit-appearance:none;width:32px;height:32px;border-radius:50%;border:3px solid #5a2d0c;background:var(--track);cursor:pointer;position:relative;transition:transform .15s,background .2s}
.chk:hover{transform:scale(1.1)}
.chk:checked{background:radial-gradient(circle at 35% 30%,#fff4a8,var(--gold) 55%,#d48a0a);animation:coin .6s ease}
.chk:checked::after{content:"\2605";position:absolute;inset:0;display:grid;place-items:center;font-size:16px;color:#8a4a06}
@keyframes coin{0%{transform:scale(.6) rotateY(0)}60%{transform:scale(1.3) rotateY(360deg)}100%{transform:scale(1) rotateY(360deg)}}
.prog{margin-top:14px;display:grid;gap:12px}
.p{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.85rem;font-weight:800}
.bar{height:16px;border-radius:99px;background:var(--track);border:3px solid #5a2d0c;overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--c),var(--c) 8px,rgba(255,255,255,.35) 8px,rgba(255,255,255,.35) 16px);background-size:23px 23px;animation:stripes 1s linear infinite;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes stripes{to{background-position:23px 0}}
.pct{text-align:right}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140px);background:var(--red);color:#fff;font-family:Bangers,Impact,sans-serif;letter-spacing:.06em;font-size:1.3rem;padding:8px 22px;border:3px solid #5a2d0c;border-radius:14px;box-shadow:0 5px 0 #5a2d0c;transition:transform .45s cubic-bezier(.3,1.5,.5,1);z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0) rotate(-2deg)}
.dot{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:15;background:radial-gradient(#fff4a8,var(--gold));border:2px solid #8a4a06}
.flash{position:fixed;inset:0;pointer-events:none;z-index:14;background:repeating-conic-gradient(from 0deg at var(--x) var(--y),rgba(255,255,255,.55) 0 4deg,transparent 4deg 10deg);animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (max-width:520px){h1{font-size:1.7rem}.ship{width:60px}.score{grid-template-columns:1fr 1fr}.stat.poster{grid-column:span 2}.p{grid-template-columns:100px 1fr 40px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="cloud" style="top:70px;animation-duration:70s"></div>
<div class="cloud" style="top:150px;animation-duration:105s;animation-delay:-40s;transform:scale(.7)"></div>
<div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
<div class="wrap" id="wrap">
<header>
  <div class="ttl">
    <svg class="ship" viewBox="0 0 84 70" aria-hidden="true">
      <rect x="40" y="6" width="3" height="42" fill="#5a2d0c"/>
      <path d="M43 10 Q72 24 43 42Z" fill="#fff" stroke="#5a2d0c" stroke-width="2.5"/>
      <path d="M40 14 Q16 26 40 40Z" fill="#fff" stroke="#5a2d0c" stroke-width="2.5"/>
      <circle cx="58" cy="26" r="5" fill="#e4483b"/>
      <path d="M43 6 L58 11 L43 16Z" fill="#e4483b" stroke="#5a2d0c" stroke-width="2"/>
      <path d="M6 48 H78 Q72 64 58 64 H26 Q12 64 6 48Z" fill="#c4772a" stroke="#5a2d0c" stroke-width="3"/>
      <circle cx="26" cy="55" r="3" fill="#f5b82e" stroke="#5a2d0c" stroke-width="1.5"/>
      <circle cx="42" cy="55" r="3" fill="#f5b82e" stroke="#5a2d0c" stroke-width="1.5"/>
      <circle cx="58" cy="55" r="3" fill="#f5b82e" stroke="#5a2d0c" stroke-width="1.5"/>
    </svg>
    <div><h1>Grand Line Habit Log</h1><div class="sub">Tap a coin to log your day. Tap a habit name to rename it.</div></div>
  </div>
  <div class="tools"><button class="ghost" id="snd">Sound: on</button><button class="ghost" id="reset">New week</button></div>
</header>
<section class="score">
  <div class="stat poster"><small>WANTED</small><b id="pts">0</b><span id="rank">Cabin Boy</span></div>
  <div class="stat"><b id="lvl">1</b><span>Rank level</span></div>
  <div class="stat"><b id="done">0/28</b><span>Check-ins</span></div>
</section>
<section class="card">
  <div class="grid" id="grid"></div>
  <div class="prog" id="prog"></div>
</section>
</div>
<div class="toast" id="toast"></div>
<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const COLORS=["#ff7b6b","#4fc3f7","#7bd88f","#b48cf2"];
const RANKS=[[0,"Cabin Boy"],[60,"Deckhand"],[150,"Navigator"],[250,"First Mate"],[350,"Captain"],[450,"Pirate King"]];
const KEY="habit-tracker-v1";
const DEFAULT={sound:true,habits:[
 {n:"Listen to messages",d:Array(7).fill(false)},
 {n:"Pray for one hour",d:Array(7).fill(false)},
 {n:"Orders checklist",d:Array(7).fill(false)},
 {n:"Your own habit",d:Array(7).fill(false)}]};
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.habits&&s.habits.length===4)return s}catch(e){}return JSON.parse(JSON.stringify(DEFAULT))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let actx;
function tone(f,t0,dur,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;
 const t=actx.currentTime+t0;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.05)}
function sfx(kind){if(!state.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 if(kind==="coin"){tone(988,0,.12,"square",.08);tone(1319,.09,.3,"square",.08)}
 else if(kind==="undo"){tone(300,0,.2,"triangle",.12)}
 else if(kind==="treasure"){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.35,"triangle",.14))}
 else if(kind==="rank"){[392,523,659,784].forEach((f,i)=>tone(f,i*.12,.4,"sawtooth",.07));tone(100,0,.4,"sine",.25)}
}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function burst(x,y,n){for(let i=0;i<n;i++){const d=document.createElement("div");d.className="dot";d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);
 const a=Math.random()*6.28,r=50+Math.random()*90;
 d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+40}px) scale(.3)`,opacity:0}],{duration:800,easing:"ease-out"}).onfinish=()=>d.remove()}}
function speedLines(x,y){const f=document.createElement("div");f.className="flash";f.style.setProperty("--x",x+"px");f.style.setProperty("--y",y+"px");document.body.appendChild(f);setTimeout(()=>f.remove(),520)}
function calc(){let c=0,bonus=0,streak=0;state.habits.forEach(h=>{const n=h.d.filter(Boolean).length;c+=n;if(n===7)bonus+=50;let run=0;h.d.forEach(v=>{run=v?run+1:0;if(run>2)streak+=5})});
 return{c,pts:c*10+bonus+streak}}
function rankOf(p){let r=0;RANKS.forEach((x,i)=>{if(p>=x[0])r=i});return r}
let last={};
function setNum(id,v,txt){const e=document.getElementById(id);if(last[id]!==undefined&&last[id]!==v){e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}last[id]=v;e.textContent=txt!==undefined?txt:v}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const g=document.getElementById("grid");
 g.innerHTML='<div class="row head"><div></div>'+DAYS.map(d=>`<div>${d}</div>`).join("")+"</div>";
 state.habits.forEach((h,i)=>{const r=document.createElement("div");r.className="row";
  r.innerHTML=`<div class="name" data-i="${i}">${esc(h.n)}</div>`+h.d.map((v,j)=>`<div class="cell"><input type="checkbox" class="chk" data-i="${i}" data-j="${j}" ${v?"checked":""} aria-label="${esc(h.n)} ${DAYS[j]}"></div>`).join("");
  g.appendChild(r)});
 document.getElementById("prog").innerHTML=state.habits.map((h,i)=>{const n=h.d.filter(Boolean).length,p=Math.round(n/7*100);return`<div class="p"><span>${esc(h.n)}</span><div class="bar"><div class="fill" style="--c:${COLORS[i]};width:${p}%"></div></div><span class="pct">${p}%</span></div>`}).join("");
 const s=calc(),rk=rankOf(s.pts);
 setNum("pts",s.pts,"\u0E3F "+(s.pts*1000).toLocaleString("en-US"));
 setNum("lvl",rk+1);
 document.getElementById("rank").textContent=RANKS[rk][1]+(rk<5?" \u2022 next at "+RANKS[rk+1][0]+" pts":"");
 document.getElementById("done").textContent=s.c+"/28";
 document.getElementById("snd").textContent="Sound: "+(state.sound?"on":"off")}
document.getElementById("grid").addEventListener("change",e=>{
 const t=e.target;if(!t.classList.contains("chk"))return;
 const i=+t.dataset.i,j=+t.dataset.j,h=state.habits[i],before=rankOf(calc().pts);
 h.d[j]=t.checked;save();
 if(t.checked){const b=t.getBoundingClientRect(),x=b.left+16,y=b.top+16;
  burst(x,y,12);
  if(h.d.every(Boolean)){speedLines(x,y);burst(x,y,30);sfx("treasure");toast("TREASURE FOUND! +50 bonus");document.getElementById("wrap").classList.remove("shake");void document.getElementById("wrap").offsetWidth;document.getElementById("wrap").classList.add("shake")}
  else sfx("coin");
  const after=rankOf(calc().pts);
  if(after>before){setTimeout(()=>{sfx("rank");toast("RANK UP: "+RANKS[after][1].toUpperCase()+"!")},350)}}
 else sfx("undo");
 render()});
document.getElementById("grid").addEventListener("click",e=>{
 const n=e.target.closest(".name");if(!n)return;const i=+n.dataset.i;
 const v=prompt("Rename habit",state.habits[i].n);if(v&&v.trim()){state.habits[i].n=v.trim().slice(0,40);save();render()}});
document.getElementById("snd").onclick=()=>{state.sound=!state.sound;save();render();sfx("coin")};
document.getElementById("reset").onclick=()=>{if(confirm("Set sail on a new week? This clears all check-ins.")){state.habits.forEach(h=>h.d=Array(7).fill(false));save();render()}};
render();
</script>
</body>
</html>
